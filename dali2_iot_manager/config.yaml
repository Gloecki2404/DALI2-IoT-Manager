name: DALI-2 IoT Manager
version: "2.0.0"
slug: dali2_iot_manager
description: Verwaltung, Busmonitor und Analysen für DALI-2-Anlagen (Gateway Lunatone DALI-2 IoT)
url: https://github.com/Gloecki2404/Lunatone-Dali-Addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:lightbulb-group
panel_title: DALI-2 IoT
hassio_api: true
homeassistant_api: true
discovery:
  - dali2_iot
options:
  gateway_host: ""
  history_days: 30
  monitor_buffer: 100000
  log_level: info
schema:
  gateway_host: str?
  history_days: int(1,365)
  monitor_buffer: int(1000,2000000)
  log_level: list(debug|info|warning|error)
